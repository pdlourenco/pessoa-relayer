name: Release

# On a version tag: check it matches pyproject.toml, build the image with the
# pinned Claude Code version, run the smoke checks, and publish it to ghcr.
# Deployments pin the exact tag in their own compose file, kept outside this
# repository.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - name: tag matches the package version
        run: scripts/check-release-tag.sh "$GITHUB_REF_NAME"
      - name: build and smoke-test
        run: scripts/image-smoke.sh "$(cat .claude-code-version)"
      - name: publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag pessoa-relayer:smoke "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:$GITHUB_REF_NAME"

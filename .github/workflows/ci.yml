name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: install tmux (the backend tests run against a real server)
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: real-user isolation tests, as root (they skip without it)
        run: sudo -E env "PATH=$PATH" python -m unittest discover -s tests -p test_users.py -v
      - name: shipped examples validate
        run: relayer validate --heteronyms examples/heteronyms.yaml --templates templates

  image:
    name: image smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned in .claude-code-version and bumped by PR, so CI tests the
      # exact Claude Code version a release would ship.
      - run: scripts/image-smoke.sh "$(cat .claude-code-version)"

  image-extras:
    name: image extras (every optional tool on)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: build with every extra
        run: >
          docker build -t pessoa-relayer:extras
          --build-arg CLAUDE_CODE_VERSION="$(cat .claude-code-version)"
          --build-arg INSTALL_GH=1 --build-arg TEA_VERSION=0.9.2
          --build-arg GLAB_VERSION=1.131.0 --build-arg BUN_VERSION=1.2.0
          --build-arg EXTRA_APT_PACKAGES=jq .
      - name: each extra runs
        run: |
          for t in gh tea glab bun jq; do
            docker run --rm --entrypoint "$t" pessoa-relayer:extras --version
          done

  release-tag-check:
    name: release tag check fails on a mismatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: matching tag passes
        run: scripts/check-release-tag.sh "v$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
      - name: mismatched tag fails
        run: "! scripts/check-release-tag.sh v999.0.0"

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: install tmux (the backend tests run against a real server)
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: shipped examples validate
        run: relayer validate --heteronyms examples/heteronyms.yaml --templates templates

  image:
    name: image smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # "stable" keeps CI green across releases; deployments pin an exact
      # version in .env (README "Deploy").
      - run: scripts/image-smoke.sh stable

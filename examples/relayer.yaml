# Example runtime config for Claude Code (docs/SPEC.md §3). Copy and adjust;
# nothing here names a host.
version: 1
class: assistants          # the trust class this container runs (docs/SPEC.md §1.5)
work_root: /work
models:
  fast: haiku
  standard: sonnet
  strong: opus
  frontier: fable
session:
  command: ["claude", "--model", "{model}", "--settings", "{settings}"]
  # Sessions inherit nothing (docs/SPEC.md §4.2). HOME, PATH and LANG are
  # passed, TERM is set; list anything else here. The image sets these.
  pass_env: [CLAUDE_CONFIG_DIR, DISABLE_AUTOUPDATER, DISABLE_UPDATES]
  env: {}
tmux_socket: pessoa

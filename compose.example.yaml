# Example compose file for pessoa-relayer: one service per trust class
# (README "Deploy"). A real deployment keeps its own compose file outside
# this repository, pins an exact image tag, and puts every host-specific
# value in .env. Network settings are host-specific too: put network_mode or
# networks in an override file.
services:
  assistants:
    image: ghcr.io/pdlourenco/pessoa-relayer:${RELAYER_IMAGE_TAG:?pin a release tag, e.g. v0.1.0}
    restart: unless-stopped
    volumes:
      - ${RELAYER_DEFINITIONS_DIR:?host path of the private definitions repository}:/definitions:ro
      - ${RELAYER_CONFIG_DIR:?host path holding this class's relayer.yaml}:/config:ro
      - ${RELAYER_HOMES_DIR:?host path for heteronym homes, with their Claude config and sign-in}:/homes
      - ${RELAYER_WORK_DIR:?host path for heteronym workspaces}:/work
      - ${RELAYER_STATE_DIR:?host path for supervisor state}:/state
    mem_limit: ${RELAYER_MEM_LIMIT:-4g}
    # No Docker socket, no privileged mode. The supervisor is root in the
    # container with only the three capabilities it needs to create one Unix
    # user per heteronym and hand it its folders (docs/SPEC.md §6).
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]

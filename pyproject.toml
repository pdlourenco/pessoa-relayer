[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pessoa-relayer"
version = "0.0.1"
description = "Run long-lived agent personas from config and relay chat channels to them"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.scripts]
relayer = "relayer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

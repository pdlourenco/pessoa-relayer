# A general assistant: notes, research, drafting. No repository write access,
# no forge token, so it is safe to create from chat (docs/SPEC.md §2).
version: 1
description: General assistant with its own notes folder and no repository access.
max_tier: strong
default_tier: standard
folders: ["{work}/{name}"]
permissions:
  allow: [Read, Edit, Write, WebSearch, WebFetch]
  # Edit(./.claude/**) stops a heteronym widening its own permissions through
  # its project settings (docs/SPEC.md §2.3). Deny wins at every level.
  deny: ["Edit(./.claude/**)", "Bash(rm *)"]
channel_kinds: [signal, telegram]
idle_stop: 2h
chat_creatable: true
